[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-efficiency-benchmark"
version = "0.1.0"
description = "Local agent efficiency and AFWB Lite benchmark tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0",
  "duckdb>=1.2",
  "huggingface-hub>=0.27",
  "orjson>=3.10",
  "plotly>=5.24",
  "polars>=1.20",
  "pyarrow>=18.0",
  "pydantic>=2.10",
  "rich>=13.9",
  "streamlit==1.57.0",
  "typer>=0.15",
]

[project.scripts]
afwb = "src.afwb.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
